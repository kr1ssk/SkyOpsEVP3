# Configuracion de los TESTS unicamente. H2 en memoria: arranca en milisegundos, sin MySQL instalado,
# y cada corrida parte de una base vacia (create-drop), asi los tests son reproducibles.
# La aplicacion real nunca usa este archivo: dev y prod corren sobre MySQL.
spring.datasource.url=jdbc:h2:mem:skyops_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origin=http://localhost:5173

jwt.secret=clave-de-prueba-solo-para-los-tests-32-caracteres
jwt.acceso-minutos=15
jwt.refresh-dias=7

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
