# Perfil por defecto: ENTORNO DE DESARROLLO. MySQL local, base "skyops_dev" (se crea sola si no existe).
# Los tests NO usan este archivo: usan src/test/resources/application.properties, con H2 en memoria.
spring.application.name=skyops-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:skyops_dev}?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# JWT: en produccion se define la variable de entorno JWT_SECRET (minimo 32 caracteres)
jwt.secret=${JWT_SECRET:skyops-clave-solo-para-desarrollo-cambiala-32+}
jwt.acceso-minutos=15
jwt.refresh-dias=7

# No generar el usuario "user" con clave aleatoria de Spring Security (usamos nuestra tabla de usuarios)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Actuator: solo el chequeo de salud, sin detalles internos a quien no esta autenticado.
# Incluye el estado de la base, asi "healthy" significa que la instancia puede atender de verdad.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
