name: CI del backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Los tests corren sobre H2 en memoria (src/test/resources/application.properties),
      # asi que no hace falta levantar un MySQL en el runner.
      - name: Compilar y correr las pruebas
        run: ./mvnw -B clean verify

      # La evidencia se sube aunque las pruebas fallen, para poder revisarla
      - name: Guardar informes de las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Guardar el jar compilado
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          if-no-files-found: error
          retention-days: 30
