# Perfil por defecto: base H2 en memoria, para correr sin instalar nada (los datos se pierden al apagar).
# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:skyops, usuario: sa, sin clave)
spring.application.name=skyops-backend
spring.datasource.url=jdbc:h2:mem:skyops
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# JWT: en producción define la variable de entorno JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:skyops-clave-solo-para-desarrollo-cambiala-32+}
jwt.acceso-minutos=15
jwt.refresh-dias=7

# No generar el usuario "user" con clave aleatoria de Spring Security (usamos nuestra tabla de usuarios)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
