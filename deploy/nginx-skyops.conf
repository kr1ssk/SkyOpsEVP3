# SkyOps en una sola instancia EC2.
#
# nginx sirve el frontend ya compilado y hace de proxy del backend, asi el navegador
# ve UN SOLO ORIGEN. Eso resuelve tres problemas de una vez:
#   1. No hay mixed content: no conviven una pagina https con una API http.
#   2. No hay CORS: el frontend y la API comparten origen.
#   3. Hay una sola URL que mostrar en la defensa, en vez de dos puertos.
#
# Instalacion:
#   sudo cp deploy/nginx-skyops.conf /etc/nginx/sites-available/skyops
#   sudo ln -sf /etc/nginx/sites-available/skyops /etc/nginx/sites-enabled/skyops
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    root /var/www/skyops;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Chequeo de salud: lo usa el balanceador y sirve de heartbeat en la presentacion
    location = /actuator/health { proxy_pass http://127.0.0.1:8080/actuator/health; }

    location /swagger-ui/       { proxy_pass http://127.0.0.1:8080/swagger-ui/; }
    location = /swagger-ui.html { proxy_pass http://127.0.0.1:8080/swagger-ui.html; }
    location /v3/api-docs       { proxy_pass http://127.0.0.1:8080/v3/api-docs; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
