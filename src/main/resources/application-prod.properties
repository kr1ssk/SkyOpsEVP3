# Perfil prod: MySQL. Las tablas las crea JPA y la base "skyops" se crea sola si no existe.
# Todo viene del entorno; los valores por defecto sirven para un MySQL local (XAMPP: root sin clave).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:skyops}?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
server.port=8080
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# En prod la clave de firma de los tokens es obligatoria (mínimo 32 caracteres) y no tiene valor por defecto
jwt.secret=${JWT_SECRET}
